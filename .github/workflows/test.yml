# Runs Hallow Places' tests on every push and pull request. Nothing is released or deployed from here.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        working-directory: server
        run: npm test
      - name: Integration (local stand-ins for Discord, ntfy and map tiles; the Edge screenshots are skipped without Edge)
        working-directory: server
        run: node test/integration.mjs test/out
      - name: Keep the integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration
          path: server/test/out
          retention-days: 7
          if-no-files-found: ignore
